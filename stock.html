<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>학생 주식 티커 선택 - asterisk*</title>
    <meta name="description" content="학생 정보 및 관심 주식 티커 3개 등록/조회 포털" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300;400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="stylesheet" href="/src/styles/stock.css" />
  </head>
  <body>
    <!-- 상단 헤더 -->
    <header class="stock-header">
      <div class="header-container">
        <a href="/" class="brand-link" aria-label="메인 홈으로 이동">
          <img src="/Concept.svg" alt="asterisk" class="brand-logo" />
          <span class="brand-title">STOCK PORTAL</span>
        </a>
        <div class="header-auth-section">
          <button type="button" class="btn-config" id="btn-open-config" title="API 및 Firebase 환경설정">⚙ 설정</button>
          <div id="auth-container">
            <!-- JS로 Google 로그인 또는 프로필 배지 렌더링 -->
          </div>
        </div>
      </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="main-wrapper">
      <div class="portal-card">
        <div class="portal-head">
          <span class="eyebrow">STUDENT PORTFOLIO REGISTRATION</span>
          <h1>관심 주식 티커 3개 등록</h1>
          <p class="portal-desc">
            학생 정보와 본인이 선택한 3개의 주식 종목 티커를 등록하세요. Firebase 인증을 통해 Cloudflare Workers에 안전하게 저장됩니다.
          </p>
        </div>

        <!-- 로그인 안내 배너 (미로그인 시 표시) -->
        <div id="login-banner" class="login-banner hidden">
          <p>주식 티커를 등록 및 조회하려면 먼저 Google 계정으로 로그인해주세요.</p>
          <button type="button" class="btn-google-login" id="btn-banner-login">
            <svg width="16" height="16" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span>Google 계정으로 로그인</span>
          </button>
        </div>

        <!-- 주식 티커 등록 폼 -->
        <form id="stock-form" class="stock-form">
          <!-- 1. 학생 기본 정보 -->
          <div class="form-section">
            <h3 class="form-section-title">01. 학생 정보</h3>
            <div class="form-grid-3">
              <div class="field-group">
                <label for="input-grade">학년</label>
                <select id="input-grade" name="grade" required>
                  <option value="1" selected>1학년</option>
                  <option value="2">2학년</option>
                  <option value="3">3학년</option>
                </select>
              </div>
              <div class="field-group">
                <label for="input-class">반</label>
                <input
                  type="number"
                  id="input-class"
                  name="class_num"
                  placeholder="예: 2"
                  min="1"
                  max="20"
                  required
                />
              </div>
              <div class="field-group">
                <label for="input-student-num">번호</label>
                <input
                  type="number"
                  id="input-student-num"
                  name="student_num"
                  placeholder="예: 15"
                  min="1"
                  max="50"
                  required
                />
              </div>
            </div>
          </div>

          <!-- 2. 주식 종목 티커 3개 -->
          <div class="form-section" style="margin-top: 18px;">
            <h3 class="form-section-title">02. 관심 주식 티커 (3개)</h3>
            <div class="form-grid-3">
              <div class="field-group">
                <label for="input-ticker-1">티커 1</label>
                <input
                  type="text"
                  id="input-ticker-1"
                  name="ticker_1"
                  class="ticker-input"
                  placeholder="예: AAPL"
                  maxlength="15"
                  autocomplete="off"
                  required
                />
              </div>
              <div class="field-group">
                <label for="input-ticker-2">티커 2</label>
                <input
                  type="text"
                  id="input-ticker-2"
                  name="ticker_2"
                  class="ticker-input"
                  placeholder="예: NVDA"
                  maxlength="15"
                  autocomplete="off"
                  required
                />
              </div>
              <div class="field-group">
                <label for="input-ticker-3">티커 3</label>
                <input
                  type="text"
                  id="input-ticker-3"
                  name="ticker_3"
                  class="ticker-input"
                  placeholder="예: TSLA"
                  maxlength="15"
                  autocomplete="off"
                  required
                />
              </div>
            </div>
            <p class="ticker-hints">* 영문 소문자를 입력하면 자동으로 대문자로 변환됩니다.</p>

            <!-- 빠른 티커 입력 칩 -->
            <div class="popular-tickers">
              <span class="popular-label">추천 퀵 입력:</span>
              <div class="popular-chips-wrap">
                <button type="button" class="chip-btn" data-ticker="AAPL">AAPL</button>
                <button type="button" class="chip-btn" data-ticker="NVDA">NVDA</button>
                <button type="button" class="chip-btn" data-ticker="TSLA">TSLA</button>
                <button type="button" class="chip-btn" data-ticker="MSFT">MSFT</button>
                <button type="button" class="chip-btn" data-ticker="GOOGL">GOOGL</button>
                <button type="button" class="chip-btn" data-ticker="AMZN">AMZN</button>
                <button type="button" class="chip-btn" data-ticker="META">META</button>
                <button type="button" class="chip-btn" data-ticker="005930.KS">005930.KS (삼성전자)</button>
                <button type="button" class="chip-btn" data-ticker="BTC-USD">BTC-USD</button>
              </div>
            </div>
          </div>

          <!-- 3. 제출 및 상태 정보 -->
          <div class="action-box">
            <div id="status-panel" class="status-panel hidden">
              <span class="status-badge-ok">✓ 기존 데이터 로드됨</span>
              <span class="status-saved-time" id="status-saved-time">-</span>
            </div>
            <button type="submit" class="btn-submit-main" id="btn-submit">
              <span>저장하기 (POST /submit)</span>
            </button>
          </div>
        </form>
      </div>
    </main>

    <!-- 설정 모달 (Base URL & Firebase Config) -->
    <div id="config-modal" class="modal-overlay hidden" aria-modal="true" role="dialog">
      <div class="modal-box">
        <div class="modal-head">
          <h2>환경 설정</h2>
          <button type="button" class="btn-modal-close" id="btn-close-config">✕</button>
        </div>
        <div class="modal-body">
          <label>
            <span>Cloudflare Workers API Base URL</span>
            <input type="url" id="config-api-base-url" placeholder="https://student-stock-api.wodnjs.workers.dev" />
          </label>
          <label>
            <span>Firebase API Key</span>
            <input type="text" id="config-fb-api-key" placeholder="AIzaSy..." />
          </label>
          <label>
            <span>Firebase Auth Domain</span>
            <input type="text" id="config-fb-auth-domain" placeholder="your-app.firebaseapp.com" />
          </label>
          <label>
            <span>Firebase Project ID</span>
            <input type="text" id="config-fb-project-id" placeholder="your-project-id" />
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="btn-config-cancel">취소</button>
          <button type="button" class="btn-primary" id="btn-config-save">저장</button>
        </div>
      </div>
    </div>

    <!-- 알림 토스트 -->
    <div id="toast" class="toast-msg hidden"></div>

    <script type="module" src="/src/stockMain.ts"></script>
  </body>
</html>
