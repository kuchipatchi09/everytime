<!DOCTYPE html>
<html lang="ko">
<head>

  <style>

<body class="bg-[#F7F6F2] text-[#000000]">
  <div id="root"></div>

  <script type="text/babel">
    const ArrowLeftIcon = ({ size = 16, className = "", style = {} }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>

    const ArrowUpRightIcon = ({ size = 16, className = "", style = {} }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
    );
    const CheckIcon = ({ size = 16, className = "", style = {} }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="M20 6 9 17l-5-5"/></svg>
    );
    const CopyIcon = ({ size = 16, className = "", style = {} }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
    );

    function AsteriskDesignSystem() {
      // 스토리가 기본으로 먼저 보이도록 'story'로 변경
      const [activeTab, setActiveTab] = React.useState('story');
      const [copiedInfo, setCopiedInfo] = React.useState(null);

      const copyHex = (hex, name) => {
        if (navigator?.clipboard?.writeText) {
          navigator.clipboard.writeText(hex);
        }
        setCopiedInfo({ hex, name });
        setTimeout(() => setCopiedInfo(null), 2000);
      };

      const monochromeTokens = [
        {
          name: 'Absolute Ink Black',
          koreanName: '앱솔루트 잉크 블랙',
          hex: '#000000',
          desc: '워드마크와 헤드라인, 고대비 반전 컴포넌트에 사용되는 칠흑색',
          isBase: true,
          contrastText: '#F7F6F2'
        },
        {
          name: 'Carbon Steel',
          koreanName: '카본 스틸',
          hex: '#1C1C1E',
          desc: '솔리드 버튼 및 액티브 상태의 하우징 표면을 정의하는 깊은 암색',
          isBase: false,
          contrastText: '#F7F6F2'
        },
        {
          name: 'Graphite Division',
          koreanName: '그라파이트 디비전',
          hex: '#48484A',
          desc: '1px 정밀 보더라인 및 데이터 그리드 축을 구분하는 기준선',
          isBase: false,
          contrastText: '#F7F6F2'
        },
        {
          name: 'Muted Telemetry',
          koreanName: '뮤티드 텔레메트리',
          hex: '#8E8E93',
          desc: '인덱스 번호, 보조 메타데이터, 파라미터 수치 전용',
          isBase: false,
          contrastText: '#000000'
        },
        {
          name: 'Silver Mist',
          koreanName: '실버 미스트',
          hex: '#D1D1D6',
          desc: '비활성 상태의 분할선 및 소프트 호버 인터랙션 라인',

          koreanName: '베이스 페이퍼 화이트',

                </div>
              </div>

                      : 'bg-transparent text-black border-transparent hover:border-black'

                </div>

                {/* Narrative Sections */}
                <div className="border-t border-b border-black divide-y divide-black">

                  {/* Chapter 01 */}

                    <div className="lg:col-span-4">
                      <div className="text-sm font-mono-custom text-black font-semibold tracking-wider">
                        CHAPTER 01
                      </div>
                    </div>

                    <div className="lg:col-span-8 space-y-6">
                      <h3 className="text-2xl sm:text-4xl font-light tracking-tight text-black leading-snug">
                        은하계의 궁극적 해답에서 시작된 기호
                      </h3>
                      <blockquote className="p-4 border-l-2 border-black bg-[#EBE9E1] text-xs sm:text-sm font-mono-custom text-[#48484A]">
                        "The Answer to the Ultimate Question of Life, the Universe, and Everything is... Forty-two."<br />
                        — Douglas Adams, 《The Hitchhiker's Guide to the Galaxy》
                      </blockquote>
                      <div className="space-y-4 text-sm sm:text-base font-light leading-relaxed text-[#48484A]">
                        <p>
                          SF 문학의 고전 《은하수를 여행하는 히치하이커를 위한 안내서》에서 슈퍼컴퓨터 '깊은 생각'이 750만 년 동안 연산한 끝에 내놓은 삶, 우주, 그리고 모든 것에 대한 궁극적 해답은 단지 <strong>'42'</strong>였습니다.
                        </p>
                        <p>

                        </p>
                        <p>
                          우연처럼 맞물린 이 발견은 서비스의 모티브가 되었습니다. 수많은 포털 사이트, 분산된 강의실 공지, 흩어진 커뮤니티 속에서 혼란을 겪는 학생들에게 <code>asterisk*</code>는 캠퍼스라는 소우주 속에서 던져지는 모든 질문에 대한 명쾌한 기준점이자 해답이 되고자 합니다.
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* Chapter 02 */}
                  <div className="py-14 md:py-20 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                    <div className="lg:col-span-4">
                      <div className="text-sm font-mono-custom text-black font-semibold tracking-wider">
                        CHAPTER 02
                      </div>
                    </div>

                    <div className="lg:col-span-8 space-y-6">
                      <h3 className="text-2xl sm:text-4xl font-light tracking-tight text-black leading-snug">
                        모든 캠퍼스 데이터를 아우르는 와일드카드
                      </h3>
                      <div className="space-y-4 text-sm sm:text-base font-light leading-relaxed text-[#48484A]">
                        <p>
                          프로그래밍 언어와 데이터베이스에서 <code>*</code> 기호는 모든 조건을 아우르는 <strong>와일드카드(Wildcard)</strong> 문자로서 <strong>‘모든 것(Everything)’</strong>을 의미합니다.
                        </p>
                        <ul className="space-y-2.5 my-4 p-5 border border-black bg-[#EBE9E1] font-mono-custom text-xs text-black">
                          <li className="flex items-center gap-2">
                            <span>*</span> <span>TIMETABLE & CLASSROOMS (시간표 및 강의실 동선)</span>
                          </li>
                          <li className="flex items-center gap-2">
                            <span>*</span> <span>CAFETERIA NUTRITION (일일 급식 및 식단 정보)</span>
                          </li>
                          <li className="flex items-center gap-2">
                            <span>*</span> <span>ACADEMIC NOTICE & CALENDAR (학사 일정 및 주요 공지)</span>
                          </li>
                          <li className="flex items-center gap-2">
                            <span>*</span> <span>CAMPUS FORUM & DIALOGUE (실시간 학생 커뮤니티)</span>
                          </li>
                        </ul>
                        <p>
                          <code>asterisk*</code>는 흩어져 있던 학교의 기능들을 단 하나의 정밀한 캔버스 위에 집약합니다. 학생들이 매일 생활하며 마주하는 모든 일상을 빈틈없이 불러와 가장 직관적인 형태로 렌더링합니다.
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* Chapter 03 */}
                  <div className="py-14 md:py-20 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                    <div className="lg:col-span-4">
                      <div className="text-sm font-mono-custom text-black font-semibold tracking-wider">
                        CHAPTER 03
                      </div>
                    </div>

                    <div className="lg:col-span-8 space-y-6">
                      <h3 className="text-2xl sm:text-4xl font-light tracking-tight text-black leading-snug">
                        결정적인 각주, 그리고 본질만을 남긴 흑백의 미학
                      </h3>
                      <div className="space-y-4 text-sm sm:text-base font-light leading-relaxed text-[#48484A]">
                        <p>
                          문서 조판에서 <code>*</code>는 본문 아래 숨겨진 중요한 진실을 짚어주는 <strong>각주(Footnote)</strong> 기호입니다. 거대한 본문 속에서 정작 일상을 지탱하는 중요한 정보는 사소한 각주에 적혀 있듯, 수강신청 마감 시각, 강의실 긴급 변경, 식당 특식 메뉴 같은 작지만 결정적인 순간들을 선명하게 비춥니다.
                        </p>
                        <p>
                          이러한 정보를 가장 정확하게 전달하기 위해 우리는 화려한 시각적 장식을 배제했습니다. 실제 인쇄 용지의 감촉을 담은 <strong>Base Paper White (#F7F6F2)</strong>와 선명한 가독성을 보장하는 <strong>Absolute Ink Black (#000000)</strong>의 흑백 팔레트 위에 1px의 정밀한 그리드만을 설계했습니다.
                        </p>
                        <p>
                          감각적 피로감을 최소화하고 사용자가 원하는 정보에 가장 빠르게 도달하도록 돕는 공학적 미니멀리즘의 실현입니다.
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* Epilogue Banner */}
                  <div className="py-14 md:py-20 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center bg-black text-[#F7F6F2] p-8 sm:p-12">
                    <div className="lg:col-span-4">
                      <div className="text-xl sm:text-2xl font-light tracking-tight">
                        DON'T PANIC
                      </div>
                    </div>
                    <div className="lg:col-span-8">
                      <p className="text-sm sm:text-base font-light leading-relaxed opacity-90">
                        《히치하이커를 위한 안내서》 표지에 커다랗고 친절하게 적혀 있던 문구처럼, 낯선 시간표와 쏟아지는 과제 앞에서도 당황하지 마세요. 주머니 속의 <code>asterisk*</code>가 당신의 캠퍼스 라이프, 그리고 그 모든 것에 대한 가장 명쾌한 안내서가 되어줄 것입니다.
                      </p>
                    </div>
                  </div>

                </div>
              </div>
            )}

            {/* Tab 1: Design System View */}
            {activeTab === 'design' && (
              <>

                      </h1>
                    </div>

                    <div className="lg:col-span-5 flex flex-col justify-end items-start lg:items-end">
                      <div className="text-left font-light tracking-tighter text-black leading-[0.82] select-none text-[84px] sm:text-[110px] md:text-[132px]">
                        <div>aste</div>
                        <div className="flex items-baseline gap-2 sm:gap-4">
                          <span>risk</span>
                          <span className="text-[72px] sm:text-[96px] md:text-[116px] font-normal leading-none transform translate-y-1">*</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="mt-12 pt-6 border-t border-black/20 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 text-xs font-mono-custom text-[#48484A]">
                    <div>Typography: Asta Sans × Pretendard</div>
                    <div>Palette: #F7F6F2 & #000000</div>
                  </div>
                </div>

                {/* SECTION 01: COLOR SYSTEM */}
                <section className="mb-28">

                    <p className="text-xs font-mono-custom mt-3 md:mt-0 text-[#8E8E93]">

                    <div
