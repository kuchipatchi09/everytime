  <script>
    // ==========================================================================
    // 1. 시계 로직 (흔들림 없는 고정폭)
    // ==========================================================================
    const timeHoursMins = document.getElementById('timeHoursMins');
    const timeSeconds = document.getElementById('timeSeconds');
    const timeAmPm = document.getElementById('timeAmPm');
    const dateDisplay = document.getElementById('dateDisplay');

    const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';

      const displayHours = String(hours % 12 || 12).padStart(2, '0');

      timeHoursMins.textContent = displayHours + ':' + minutes;
      timeSeconds.textContent = seconds;
      timeAmPm.textContent = ampm;

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const day = DAYS[now.getDay()];

      dateDisplay.textContent = year + ' . ' + month + ' . ' + date + '  ' + day;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ==========================================================================
    // 2. 포근하고 부드러운 벨벳 빗소리 & 천둥 물리 합성 엔진 (최적화 버전)
    // ==========================================================================
    let audioCtx = null;
    let isRunning = false;

    let masterCompressor = null;
    let masterGain = null;
    let convolverNode = null;
    let reverbWetGain = null;
    let drySignalGain = null;

    let rainBusGain = null;
    let rainReverbGain = null;
    let thunderBusGain = null;
    let rainBedPanner = null;

    // 빗소리 레이어 노드
    let rainLowSource = null;
    let rainLowFilter = null;
    let rainLowGain = null;

    let rainBodySource = null;
    let rainBodyFilter = null;
    let rainBodyGain = null;

    let rainAirSource = null;
    let rainAirFilter = null;
    let rainAirGain = null;

    let sharedBrownBuffer = null;
    let sharedPinkBuffer = null;

    let dropletScheduler = null;
    let thunderScheduler = null;
    let weatherCycleTimer = null;

    let baseIntensity = 0.55;
    let currentSurge = 1.0;
    let targetSurge = 1.0;
    let currentWindDrift = -0.15;
    let targetWindDrift = -0.15;

    // 5.8초 대기 흡수 개활지 임펄스 응답
    function generateAtmosphericIR(ctx, duration = 5.8) {
      const length = ctx.sampleRate * duration;
      const buffer = ctx.createBuffer(2, length, ctx.sampleRate);
      const left = buffer.getChannelData(0);
      const right = buffer.getChannelData(1);

      let lSmooth = 0, rSmooth = 0;
      for (let i = 0; i < length; i++) {
        const t = i / ctx.sampleRate;
        const decay = Math.exp(-t * 1.10);
        const airAbsorption = Math.max(0.025, 1.0 - (t / duration) * 0.94);

        const lNoise = (Math.random() * 2 - 1) * decay;
        const rNoise = (Math.random() * 2 - 1) * decay;

        lSmooth += airAbsorption * (lNoise - lSmooth);
        rSmooth += airAbsorption * (rNoise - rSmooth);

        left[i] = lSmooth * 0.75;
        right[i] = rSmooth * 0.75;
      }
      return buffer;
    }

    // 저음 대지 럼블용 Brown Noise (12초 루프 사전 풀링)
    function createStereoBrownNoise(ctx, duration = 12) {
      const buffer = ctx.createBuffer(2, ctx.sampleRate * duration, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const data = buffer.getChannelData(ch);
        let acc = 0.0;
        for (let i = 0; i < data.length; i++) {
          const white = Math.random() * 2 - 1;
          acc = (acc + (0.02 * white)) / 1.02;
          data[i] = acc * 2.8;
        }
      }
      return buffer;
    }

    // 포근하고 부드러운 빗줄기 장막용 Velvet Pink Noise
    function createStereoPinkNoise(ctx, duration = 8) {
      const buffer = ctx.createBuffer(2, ctx.sampleRate * duration, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const data = buffer.getChannelData(ch);
        let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
        for (let i = 0; i < data.length; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.76160 * b5 - white * 0.0168980;
          data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
          b6 = white * 0.115926;
        }
      }
      return buffer;
    }

    function initAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      masterCompressor = audioCtx.createDynamicsCompressor();
      masterCompressor.threshold.setValueAtTime(-20, audioCtx.currentTime);
      masterCompressor.knee.setValueAtTime(12, audioCtx.currentTime);
      masterCompressor.ratio.setValueAtTime(3.5, audioCtx.currentTime);

      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.55, audioCtx.currentTime);

      masterCompressor.connect(masterGain);
      masterGain.connect(audioCtx.destination);

      convolverNode = audioCtx.createConvolver();
      convolverNode.buffer = generateAtmosphericIR(audioCtx, 5.8);

      reverbWetGain = audioCtx.createGain();
      reverbWetGain.gain.setValueAtTime(0.55, audioCtx.currentTime);

      drySignalGain = audioCtx.createGain();
      drySignalGain.gain.setValueAtTime(0.75, audioCtx.currentTime);

      convolverNode.connect(reverbWetGain);
      reverbWetGain.connect(masterCompressor);
      drySignalGain.connect(masterCompressor);

      rainBedPanner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

      rainBusGain = audioCtx.createGain();
      rainBusGain.gain.setValueAtTime(parseFloat(rainVolSlider.value), audioCtx.currentTime);

      // 빗소리 전용 리버브 센드 (CPU 과부하 방지: 미세한 공간감만 전달)
      rainReverbGain = audioCtx.createGain();
      rainReverbGain.gain.setValueAtTime(0.18, audioCtx.currentTime);

      if (rainBedPanner) {
        rainBedPanner.connect(drySignalGain);
        rainBedPanner.connect(rainReverbGain);
        rainReverbGain.connect(convolverNode);
        rainBusGain.connect(rainBedPanner);
      } else {
        rainBusGain.connect(drySignalGain);
        rainBusGain.connect(rainReverbGain);
        rainReverbGain.connect(convolverNode);
      }

      thunderBusGain = audioCtx.createGain();
      thunderBusGain.gain.setValueAtTime(parseFloat(thunderVolSlider.value), audioCtx.currentTime);
      thunderBusGain.connect(drySignalGain);
      thunderBusGain.connect(convolverNode);

      // 버퍼 1회 사전 생성 및 캐싱 (천둥 시 메인스레드 프리징 0%)
      sharedBrownBuffer = createStereoBrownNoise(audioCtx, 12);
      sharedPinkBuffer = createStereoPinkNoise(audioCtx, 8);
    }

    function runDynamicWeatherEngine() {
      if (!isRunning || !audioCtx) return;

      const now = audioCtx.currentTime;
      const cycleDuration = 6.0 + Math.random() * 6.0;

      targetSurge = 0.8 + Math.random() * 0.45;
      targetWindDrift = -0.05 - (Math.random() * 0.35);

      if (rainLowGain && rainBodyGain && rainAirGain) {
        const effIntensity = Math.min(1.0, baseIntensity * targetSurge);

        const targetLowGain = (0.28 + effIntensity * 0.4) * (0.9 + targetSurge * 0.15);
        const targetLowFreq = 260 + effIntensity * 120;

        const targetBodyGain = (0.35 + effIntensity * 0.5) * (0.85 + targetSurge * 0.2);
        const targetBodyFreq = 1350 + (targetSurge * 350);

        const targetAirGain = (0.08 + effIntensity * 0.22) * (0.9 + targetSurge * 0.2);
        const targetAirFreq = 2400 + (effIntensity * 800);

        rainLowGain.gain.setTargetAtTime(targetLowGain, now, cycleDuration * 0.35);
        rainLowFilter.frequency.setTargetAtTime(targetLowFreq, now, cycleDuration * 0.35);

        rainBodyGain.gain.setTargetAtTime(targetBodyGain, now, cycleDuration * 0.35);
        rainBodyFilter.frequency.setTargetAtTime(targetBodyFreq, now, cycleDuration * 0.35);

        rainAirGain.gain.setTargetAtTime(targetAirGain, now, cycleDuration * 0.35);
        rainAirFilter.frequency.setTargetAtTime(targetAirFreq, now, cycleDuration * 0.35);

        if (rainBedPanner) {
          rainBedPanner.pan.setTargetAtTime(targetWindDrift * 0.6, now, cycleDuration * 0.4);
        }
      }

      weatherCycleTimer = setTimeout(runDynamicWeatherEngine, cycleDuration * 1000);
    }

    function startRainSound() {
      rainLowSource = audioCtx.createBufferSource();
      rainLowSource.buffer = sharedBrownBuffer;
      rainLowSource.loop = true;

      rainLowFilter = audioCtx.createBiquadFilter();
      rainLowFilter.type = 'lowpass';
      rainLowFilter.frequency.value = 280;

      rainLowGain = audioCtx.createGain();
      rainLowGain.gain.value = 0.32 + baseIntensity * 0.38;

      rainLowSource.connect(rainLowFilter);
      rainLowFilter.connect(rainLowGain);
      rainLowGain.connect(rainBusGain);
      rainLowSource.start();

      rainBodySource = audioCtx.createBufferSource();
      rainBodySource.buffer = sharedPinkBuffer;
      rainBodySource.loop = true;

      rainBodyFilter = audioCtx.createBiquadFilter();
      rainBodyFilter.type = 'bandpass';
      rainBodyFilter.frequency.value = 1450;
      rainBodyFilter.Q.value = 0.55;

      rainBodyGain = audioCtx.createGain();
      rainBodyGain.gain.value = 0.38 + baseIntensity * 0.45;

      rainBodySource.connect(rainBodyFilter);
      rainBodyFilter.connect(rainBodyGain);
      rainBodyGain.connect(rainBusGain);
      rainBodySource.start();

      rainAirSource = audioCtx.createBufferSource();
      rainAirSource.buffer = sharedPinkBuffer;
      rainAirSource.loop = true;

      rainAirFilter = audioCtx.createBiquadFilter();
      rainAirFilter.type = 'lowpass';
      rainAirFilter.frequency.value = 2800;

      rainAirGain = audioCtx.createGain();
      rainAirGain.gain.value = 0.12 + baseIntensity * 0.2;

      rainAirSource.connect(rainAirFilter);
      rainAirFilter.connect(rainAirGain);
      rainAirGain.connect(rainBusGain);
      rainAirSource.start();

      scheduleGentleDroplets();
      runDynamicWeatherEngine();
    }

    function scheduleGentleDroplets() {
      if (!isRunning || !audioCtx) return;

      const now = audioCtx.currentTime;
      const currentEffIntensity = Math.min(1.0, baseIntensity * currentSurge);

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

      const startFreq = 420 + Math.random() * 180;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.exponentialRampToValueAtTime(startFreq * 0.75, now + 0.04);

      filter.type = 'lowpass';
      filter.frequency.value = 750;

      const dropVol = (0.003 + Math.random() * 0.005) * currentEffIntensity;
      gain.gain.setValueAtTime(0.00001, now);
      gain.gain.linearRampToValueAtTime(dropVol, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.07);

      osc.connect(filter);
      filter.connect(gain);

      if (panner) {
        panner.pan.value = (Math.random() * 2 - 1) * 0.75;
        gain.connect(panner);
        panner.connect(rainBusGain);
      } else {
        gain.connect(rainBusGain);
      }

      osc.start(now);
      osc.stop(now + 0.08);

      const nextDelay = 1200 + Math.random() * 1600;
      dropletScheduler = setTimeout(scheduleGentleDroplets, nextDelay);
    }

    function stopRainSound() {
      [rainLowSource, rainBodySource, rainAirSource].forEach(node => {
        if (node) {
          try { node.stop(); } catch(e){}
          try { node.disconnect(); } catch(e){}
        }
      });
      rainLowSource = null;
      rainBodySource = null;
      rainAirSource = null;

      if (dropletScheduler) clearTimeout(dropletScheduler);
      if (weatherCycleTimer) clearTimeout(weatherCycleTimer);
    }

    // ==========================================================================
    // 웅장한 천둥 합성 알고리즘 (버퍼 사전 풀링 & 자동 노드 정리)
    // ==========================================================================
    function triggerThunderDischarge(isManual = false) {
      if (!audioCtx || !isRunning) return;

      const distance = 0.6 + Math.random() * 0.35;
      const delay = isManual ? 0.3 : (2.0 + distance * 3.0);

      flashLightning(distance);

      setTimeout(() => {
        if (!isRunning || !audioCtx) return;
        renderThunderAcoustics(distance);
      }, delay * 1000);
    }

    function renderThunderAcoustics(distance) {
      const now = audioCtx.currentTime;
      const duration = 13.5 + Math.random() * 6.5;

      const thunderTrack = audioCtx.createGain();
      const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;

      const startSide = Math.random() > 0.5 ? 1 : -1;
      const startPan = startSide * (0.6 + Math.random() * 0.3);
      const endPan = -startPan * (0.5 + Math.random() * 0.4);

      if (panner) {
        panner.pan.setValueAtTime(startPan, now);
        panner.pan.linearRampToValueAtTime(endPan, now + duration);
        thunderTrack.connect(panner);
        panner.connect(thunderBusGain);
      } else {
        thunderTrack.connect(thunderBusGain);
      }

      // 사전 풀링된 Brown Noise 버퍼 사용 (26초 동기 연산 완전 제거!)
      const noise = audioCtx.createBufferSource();
      noise.buffer = sharedBrownBuffer;
      noise.loop = true;
      noise.playbackRate.setValueAtTime(0.85 + Math.random() * 0.25, now);

      const subFilter = audioCtx.createBiquadFilter();
      subFilter.type = 'lowpass';
      subFilter.frequency.setValueAtTime(75, now);
      subFilter.Q.value = 3.2;

      const midFilter = audioCtx.createBiquadFilter();
      midFilter.type = 'bandpass';
      midFilter.frequency.setValueAtTime(125, now);
      midFilter.Q.value = 1.6;

      const rumbleEnv = audioCtx.createGain();
      rumbleEnv.gain.setValueAtTime(0.0001, now);

      const attack = 1.6 + Math.random() * 0.8;
      const peak = 0.55 + Math.random() * 0.25;
      rumbleEnv.gain.linearRampToValueAtTime(peak, now + attack);

      const rumbleMainDuration = duration * 0.62;
      let cur = now + attack;
      const crests = Math.floor(6 + Math.random() * 4);
      const step = (rumbleMainDuration - attack) / crests;

      for (let i = 0; i < crests; i++) {
        const pTime = cur + (step * (0.7 + Math.random() * 0.6));
        const decay = Math.pow(1 - ((i + 1) / crests), 1.1);
        const amp = (0.22 + Math.random() * 0.48) * peak * decay;

        rumbleEnv.gain.setTargetAtTime(Math.max(0.001, amp * 0.38), cur + (step * 0.3), 0.35);
        rumbleEnv.gain.setTargetAtTime(Math.max(0.001, amp), pTime, 0.45);

        subFilter.frequency.setTargetAtTime(65 + amp * 45, pTime, 0.35);
        cur = pTime;
      }

      const tailStartTime = cur;
      subFilter.frequency.setTargetAtTime(50, tailStartTime, 1.4);
      rumbleEnv.gain.setTargetAtTime(0.00001, tailStartTime, 2.3);

      noise.connect(subFilter);
      noise.connect(midFilter);
      subFilter.connect(rumbleEnv);
      midFilter.connect(rumbleEnv);
      rumbleEnv.connect(thunderTrack);

      const stopTime = now + duration + 4.5;
      noise.start(now, Math.random() * 3);
      noise.stop(stopTime);

      // 사운드 종료 시 모든 일회성 오디오 노드 연결 해제 (메모리 누수 원천 차단)
      noise.onended = () => {
        try {
          noise.disconnect();
          subFilter.disconnect();
          midFilter.disconnect();
          rumbleEnv.disconnect();
          thunderTrack.disconnect();
          if (panner) panner.disconnect();
        } catch (e) {}
      };
    }

    function scheduleAutoThunder() {
      if (!isRunning) return;
      const delay = 26000 + Math.random() * 26000;
      thunderScheduler = setTimeout(() => {
        triggerThunderDischarge(false);
        scheduleAutoThunder();
      }, delay);
    }

    // ==========================================================================
    // 3. 24 FPS 시네마틱 빗줄기 & 물리 파티클 엔진 (패스 배치 & 풀링 최적화)
    // ==========================================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const lightningOverlay = document.getElementById('lightning-overlay');
    const clockDisplay = document.getElementById('clockDisplay');

    let width, height, dpr;
    let cachedPuddleGrad = null;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // 지면 웅덩이 그라디언트 리사이즈 시점에만 1회 생성 (매 프레임 생성 방지)
      const groundH = 90;
      cachedPuddleGrad = ctx.createLinearGradient(0, height - groundH, 0, height);
      cachedPuddleGrad.addColorStop(0, 'rgba(10, 11, 14, 0)');
      cachedPuddleGrad.addColorStop(0.35, 'rgba(16, 20, 28, 0.65)');
      cachedPuddleGrad.addColorStop(1, 'rgba(28, 36, 48, 0.85)');
    }
    window.addEventListener('resize', resize);
    resize();

    const TOTAL_DROPS = 1050;
    const raindrops = [];

    // 파티클 객체 풀링 시스템 (가비지 컬렉션 스파이크 100% 제거)
    const ripples = [];
    const ripplePool = [];
    function obtainRipple() {
      return ripplePool.pop() || { x: 0, y: 0, r: 0, maxR: 0, alpha: 0 };
    }
    function releaseRipple(rp) {
      ripplePool.push(rp);
    }

    const splashBeads = [];
    const splashPool = [];
    function obtainSplash() {
      return splashPool.pop() || { x: 0, y: 0, vx: 0, vy: 0, gravity: 0.24, alpha: 0, radius: 0 };
    }
    function releaseSplash(sb) {
      splashPool.push(sb);
    }

    const groundMist = [];
    const mistPool = [];
    function obtainMist() {
      return mistPool.pop() || { x: 0, y: 0, vx: 0, vy: 0, radius: 0, maxRadius: 0, alpha: 0 };
    }
    function releaseMist(gm) {
      mistPool.push(gm);
    }

    const glassDrops = [];
    const glassDropPool = [];
    function obtainGlassDrop() {
      return glassDropPool.pop() || { x: 0, y: 0, radius: 0, alpha: 0, dripSpeed: 0, trail: [], life: 0 };
    }
    function releaseGlassDrop(gd) {
      gd.trail.length = 0;
      glassDropPool.push(gd);
    }

    // O(1) 초고속 제자리 삭제
    function fastRemove(arr, idx) {
      const last = arr.pop();
      if (idx < arr.length) {
        arr[idx] = last;
      }
    }

    let animatedWind = -0.15;
    let simTime = 0;
    let lightningFlashIntensity = 0;
    let lastClockGlowStep = -1;

    for (let i = 0; i < TOTAL_DROPS; i++) {
      const z = 0.08 + Math.pow(Math.random(), 1.7) * 1.25;
      const isBokeh = z > 1.08;
      const isDrizzle = z < 0.35;

      raindrops.push({
        x: Math.random() * (width + 600) - 300,
        y: Math.random() * (height + 200) - 100,
        z: z,
        isBokeh: isBokeh,
        isDrizzle: isDrizzle,
        mass: isDrizzle ? 0.35 : (0.7 + z * 0.8),
        baseLen: isBokeh ? (90 + Math.random() * 50) : (isDrizzle ? (8 + Math.random() * 8) : (18 + z * 34)),
        baseSpeed: isBokeh ? (36 + Math.random() * 16) : (isDrizzle ? (11 + Math.random() * 8) : (16 + z * 24)),
        alpha: isBokeh ? 0.16 : (isDrizzle ? 0.18 : (0.15 + z * 0.45)),
        swayFreq: 1.5 + Math.random() * 3.0,
        swayPhase: Math.random() * Math.PI * 2,
        seed: Math.random() * 1000
      });
    }

    function triggerGroundPhysics(x, y, z, dynamicIntensity) {
      if (ripples.length < 130) {
        const rp = obtainRipple();
        rp.x = x;
        rp.y = y;
        rp.r = 1.2;
        rp.maxR = (3.5 + Math.random() * 7 * dynamicIntensity) * Math.min(1.0, z);
        rp.alpha = (0.4 + Math.random() * 0.4) * Math.min(1.0, z);
        ripples.push(rp);
      }

      if (z > 0.45 && splashBeads.length < 160) {
        const count = Math.floor(2 + Math.random() * 4 * dynamicIntensity);
        for (let i = 0; i < count; i++) {
          const angle = (Math.random() * Math.PI) - (Math.PI / 2) + (animatedWind * 0.9);
          const vel = (1.8 + Math.random() * 3.8) * Math.min(1.0, z);
          const sb = obtainSplash();
          sb.x = x;
          sb.y = y;
          sb.vx = Math.sin(angle) * vel;
          sb.vy = -Math.cos(angle) * vel;
          sb.gravity = 0.24;
          sb.alpha = 0.85 * Math.min(1.0, z);
          sb.radius = (0.6 + Math.random() * 0.7) * Math.min(1.0, z);
          splashBeads.push(sb);
        }
      }

      if (z > 0.5 && groundMist.length < 90 && Math.random() < 0.35 * dynamicIntensity) {
        const gm = obtainMist();
        gm.x = x;
        gm.y = y;
        gm.vx = animatedWind * (0.8 + Math.random() * 1.2);
        gm.vy = -(0.2 + Math.random() * 0.5);
        gm.radius = 3 + Math.random() * 6;
        gm.maxRadius = 18 + Math.random() * 20;
        gm.alpha = 0.18 * dynamicIntensity;
        groundMist.push(gm);
      }
    }

    function updateGlassCondensation(dynamicIntensity, dtScale) {
      if (glassDrops.length < 16 && Math.random() < 0.05 * dynamicIntensity) {
        const gd = obtainGlassDrop();
        gd.x = Math.random() * width;
        gd.y = Math.random() * (height * 0.85);
        gd.radius = 2.0 + Math.random() * 3.5;
        gd.alpha = 0.55 + Math.random() * 0.3;
        gd.dripSpeed = 0.15 + Math.random() * 0.45;
        gd.life = 200 + Math.random() * 250;
        glassDrops.push(gd);
      }

      for (let i = glassDrops.length - 1; i >= 0; i--) {
        const gd = glassDrops[i];
        if (Math.random() < 0.65) {
          gd.y += gd.dripSpeed * dtScale;
          if (Math.random() < 0.25) {
            gd.trail.push({ x: gd.x + (Math.random() * 0.8 - 0.4), y: gd.y, alpha: gd.alpha * 0.5, r: gd.radius * 0.6 });
          }
        }
        gd.life -= dtScale;
        gd.alpha -= 0.0018 * dtScale;

        for (let t = gd.trail.length - 1; t >= 0; t--) {
          const tr = gd.trail[t];
          ctx.fillStyle = 'rgba(247, 246, 242, ' + (tr.alpha * 0.4) + ')';
          ctx.beginPath();
          ctx.arc(tr.x, tr.y, tr.r, 0, Math.PI * 2);
          ctx.fill();
          tr.alpha -= 0.004 * dtScale;
          if (tr.alpha <= 0) fastRemove(gd.trail, t);
        }

        ctx.fillStyle = 'rgba(0, 0, 0, ' + (gd.alpha * 0.5) + ')';
        ctx.beginPath();
        ctx.arc(gd.x, gd.y, gd.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(247, 246, 242, ' + (gd.alpha * 0.95) + ')';
        ctx.beginPath();
        ctx.arc(gd.x - gd.radius * 0.3, gd.y - gd.radius * 0.35, gd.radius * 0.4, 0, Math.PI * 2);
        ctx.fill();

        if (gd.life <= 0 || gd.alpha <= 0) {
          releaseGlassDrop(gd);
          fastRemove(glassDrops, i);
        }
      }
    }

    // 24 FPS 시네마틱 렌더 루프
    const TARGET_FPS = 24;
    const FRAME_INTERVAL = 1000 / TARGET_FPS;
    const DT_SCALE = 60 / TARGET_FPS;
    let lastRenderTimestamp = performance.now();
    let animFrameId = null;

    function renderRealisticEngine(currentTimestamp) {
      animFrameId = requestAnimationFrame(renderRealisticEngine);

      const elapsed = currentTimestamp - lastRenderTimestamp;
      if (elapsed < FRAME_INTERVAL) return;

      lastRenderTimestamp = currentTimestamp - (elapsed % FRAME_INTERVAL);

      ctx.clearRect(0, 0, width, height);
      simTime += 0.0416;

      lightningFlashIntensity *= Math.pow(0.88, DT_SCALE);

      // DOM style 불필요한 연속 대입 방지 (단계화된 캐싱)
      if (lightningFlashIntensity > 0.05) {
        const step = Math.round(lightningFlashIntensity * 10);
        if (step !== lastClockGlowStep) {
          lastClockGlowStep = step;
          const ratio = step / 10;
          clockDisplay.style.textShadow = '0 0 ' + Math.round(40 * ratio) + 'px rgba(215, 230, 255, ' + (ratio * 0.75).toFixed(2) + ')';
        }
      } else if (lastClockGlowStep !== 0) {
        lastClockGlowStep = 0;
        clockDisplay.style.textShadow = '0 0 35px rgba(247, 246, 242, 0.08)';
      }

      currentSurge += (targetSurge - currentSurge) * (0.015 * DT_SCALE);
      currentWindDrift += (targetWindDrift - currentWindDrift) * (0.012 * DT_SCALE);

      const dynamicIntensity = Math.min(1.0, baseIntensity * currentSurge);

      const windTurbulence = Math.sin(simTime * 0.8) * 0.09 + Math.cos(simTime * 1.5) * 0.04;
      animatedWind = (currentWindDrift + windTurbulence);

      const activeCount = Math.floor(280 + dynamicIntensity * 760);

      // 캐시된 웅덩이 그라디언트 렌더링
      const groundH = 90;
      if (cachedPuddleGrad) {
        ctx.fillStyle = cachedPuddleGrad;
        ctx.fillRect(0, height - groundH, width, groundH);
      }

      const groundFlashAlpha = lightningFlashIntensity * 0.25;
      if (groundFlashAlpha > 0.01) {
        ctx.fillStyle = 'rgba(215, 230, 255, ' + groundFlashAlpha + ')';
        ctx.fillRect(0, height - groundH, width, groundH);
      }

      // ======================================================================
      // 빗방울 패스 일괄 배치 (Batch Rendering) - 1,000+ Gradients 완전 제거!
      // ======================================================================
      // 1. 이슬비 (Drizzle) 패스
      // 2. 일반 빗줄기 본체 (Normal Drops - Head)
      // 3. 일반 빗줄기 꼬리 (Normal Drops - Tail)
      // 4. 전경 보케 (Bokeh) 패스

      const flashBoost = 1.0 + lightningFlashIntensity * 2.2;
      const baseAlphaScale = (0.4 + dynamicIntensity * 0.6) * flashBoost;

      ctx.beginPath();
      // [패스 1: Drizzle Batch]
      for (let i = 0; i < activeCount; i++) {
        const d = raindrops[i];
        if (!d.isDrizzle) continue;

        const curtainWave = Math.sin(d.x * 0.0022 + simTime * 1.3) * Math.cos(d.y * 0.0016 - simTime * 0.9);
        const curtainDensity = 0.72 + curtainWave * 0.36;
        const sway = Math.sin(simTime * d.swayFreq + d.swayPhase) * 1.8;
        const windInfluence = animatedWind * 3.4;

        const speed = d.baseSpeed * (0.8 + dynamicIntensity * 0.5);
        const len = d.baseLen * (0.85 + dynamicIntensity * 0.45);

        const dx = (windInfluence * speed) + sway;
        const dy = speed;

        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - dx, d.y - len);

        d.x += dx * 0.28 * DT_SCALE;
        d.y += dy * DT_SCALE;

        if (d.y > height - 8) {
          d.y = -len - (Math.random() * 120);
          d.x = Math.random() * (width + 600) - 300;
        }
      }
      ctx.lineWidth = 0.75;
      ctx.strokeStyle = 'rgba(215, 228, 248, ' + Math.min(0.65, 0.22 * baseAlphaScale) + ')';
      ctx.stroke();

      // [패스 2 & 3: Normal Drops Core & Tail Batches]
      ctx.beginPath();
      for (let i = 0; i < activeCount; i++) {
        const d = raindrops[i];
        if (d.isDrizzle || d.isBokeh) continue;

        const windInfluence = animatedWind * (2.4 / d.mass);
        const speed = d.baseSpeed * (0.8 + dynamicIntensity * 0.5);
        const len = d.baseLen * (0.85 + dynamicIntensity * 0.45);

        const dx = windInfluence * speed;
        const dy = speed;

        // 밝은 전면 코어 (헤드)
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - dx * 0.45, d.y - len * 0.45);

        d.x += dx * 0.28 * DT_SCALE;
        d.y += dy * DT_SCALE;

        if (d.y > height - 8) {
          if (Math.random() < 0.45) {
            triggerGroundPhysics(d.x, height - 5, d.z, dynamicIntensity);
          }
          d.y = -len - (Math.random() * 120);
          d.x = Math.random() * (width + 600) - 300;
        }
      }
      ctx.lineWidth = (0.95 + dynamicIntensity * 0.45);
      ctx.strokeStyle = 'rgba(247, 246, 242, ' + Math.min(0.85, 0.45 * baseAlphaScale) + ')';
      ctx.stroke();

      // 부드러운 잔상 테일 (페이드아웃 효과)
      ctx.beginPath();
      for (let i = 0; i < activeCount; i++) {
        const d = raindrops[i];
        if (d.isDrizzle || d.isBokeh) continue;

        const windInfluence = animatedWind * (2.4 / d.mass);
        const speed = d.baseSpeed * (0.8 + dynamicIntensity * 0.5);
        const len = d.baseLen * (0.85 + dynamicIntensity * 0.45);

        const dx = windInfluence * speed;
        ctx.moveTo(d.x - dx * 0.45, d.y - len * 0.45);
        ctx.lineTo(d.x - dx, d.y - len);
      }
      ctx.lineWidth = (0.75 + dynamicIntensity * 0.35);
      ctx.strokeStyle = 'rgba(180, 205, 240, ' + Math.min(0.5, 0.25 * baseAlphaScale) + ')';
      ctx.stroke();

      // [패스 4: Bokeh Drops Batch]
      ctx.beginPath();
      for (let i = 0; i < activeCount; i++) {
        const d = raindrops[i];
        if (!d.isBokeh) continue;

        const windInfluence = animatedWind * (2.4 / d.mass);
        const speed = d.baseSpeed * (0.8 + dynamicIntensity * 0.5);
        const len = d.baseLen * (0.85 + dynamicIntensity * 0.45);

        const dx = windInfluence * speed;
        const dy = speed;

        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - dx, d.y - len);

        d.x += dx * 0.28 * DT_SCALE;
        d.y += dy * DT_SCALE;

        if (d.y > height - 8) {
          d.y = -len - (Math.random() * 120);
          d.x = Math.random() * (width + 600) - 300;
        }
      }
      ctx.lineWidth = 6.5 + dynamicIntensity * 2.0;
      ctx.strokeStyle = 'rgba(235, 242, 252, ' + Math.min(0.25, 0.12 * baseAlphaScale) + ')';
      ctx.stroke();

      // 파문 (Ripples)
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(247, 246, 242, ' + Math.min(1.0, rp.alpha * (1.0 + lightningFlashIntensity)) + ')';
        ctx.lineWidth = 1.1;
        ctx.ellipse(rp.x, rp.y, rp.r * 2.8, rp.r * 0.65, 0, 0, Math.PI * 2);
        ctx.stroke();

        rp.r += 0.65 * DT_SCALE;
        rp.alpha -= 0.024 * DT_SCALE;
        if (rp.alpha <= 0) {
          releaseRipple(rp);
          fastRemove(ripples, i);
        }
      }

      // 비드 파편 (Splash Beads)
      for (let i = splashBeads.length - 1; i >= 0; i--) {
        const sb = splashBeads[i];
        ctx.fillStyle = 'rgba(247, 246, 242, ' + Math.min(1.0, sb.alpha * (1.0 + lightningFlashIntensity)) + ')';
        ctx.beginPath();
        ctx.arc(sb.x, sb.y, sb.radius, 0, Math.PI * 2);
        ctx.fill();

        sb.x += sb.vx * DT_SCALE;
        sb.y += sb.vy * DT_SCALE;
        sb.vy += sb.gravity * DT_SCALE;
        sb.alpha -= 0.025 * DT_SCALE;

        if (sb.alpha <= 0 || sb.y > height - 2) {
          releaseSplash(sb);
          fastRemove(splashBeads, i);
        }
      }

      // 지면 안개 (Ground Mist)
      for (let i = groundMist.length - 1; i >= 0; i--) {
        const gm = groundMist[i];
        ctx.fillStyle = 'rgba(180, 205, 235, ' + gm.alpha + ')';
        ctx.beginPath();
        ctx.arc(gm.x, gm.y, gm.radius, 0, Math.PI * 2);
        ctx.fill();

        gm.x += gm.vx * DT_SCALE;
        gm.y += gm.vy * DT_SCALE;
        gm.radius += 0.35 * DT_SCALE;
        gm.alpha -= 0.0035 * DT_SCALE;

        if (gm.alpha <= 0 || gm.radius >= gm.maxRadius) {
          releaseMist(gm);
          fastRemove(groundMist, i);
        }
      }

      updateGlassCondensation(dynamicIntensity, DT_SCALE);
    }
    animFrameId = requestAnimationFrame(renderRealisticEngine);

    // Page Visibility API 연동 (백그라운드 탭 렌더링 중단으로 배터리/GPU 0% 절전)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (animFrameId) {
          cancelAnimationFrame(animFrameId);
          animFrameId = null;
        }
      } else {
        lastRenderTimestamp = performance.now();
        if (!animFrameId) {
          animFrameId = requestAnimationFrame(renderRealisticEngine);
        }
      }
    });

    function flashLightning(distance) {
      const maxOpacity = Math.max(0.22, (1.0 - distance) * 0.7);
      lightningOverlay.style.opacity = maxOpacity;
      lightningFlashIntensity = 1.0;

      setTimeout(() => {
        lightningOverlay.style.opacity = maxOpacity * 0.4;
        setTimeout(() => {
          lightningOverlay.style.opacity = maxOpacity * 0.95;
          lightningFlashIntensity = 1.0;
          setTimeout(() => {
            lightningOverlay.style.opacity = 0;
          }, 120);
        }, 45);
      }, 70);
    }

    // ==========================================================================
    // 4. UI 인터랙션 및 설정값 로컬 저장
    // ==========================================================================
    const powerBtn = document.getElementById('powerBtn');
    const powerText = document.getElementById('powerText');
    const iconPlay = document.getElementById('iconPlay');
    const iconPause = document.getElementById('iconPause');

    const quickPlayBtn = document.getElementById('quickPlayBtn');
    const quickPlayIcon = document.getElementById('quickPlayIcon');
    const quickPauseIcon = document.getElementById('quickPauseIcon');

    const toggleDrawerBtn = document.getElementById('toggleDrawerBtn');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const settingsDrawer = document.getElementById('settingsDrawer');
    const drawerBackdrop = document.getElementById('drawerBackdrop');

    const triggerBtn = document.getElementById('triggerBtn');
    const rainIntensitySlider = document.getElementById('rainIntensitySlider');
    const rainVolSlider = document.getElementById('rainVolSlider');
    const thunderVolSlider = document.getElementById('thunderVolSlider');

    const rainIntensityVal = document.getElementById('rainIntensityVal');
    const rainVolVal = document.getElementById('rainVolVal');
    const thunderVolVal = document.getElementById('thunderVolVal');

    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fullscreenText = document.getElementById('fullscreenText');
    const fsEnterIcon = document.getElementById('fsEnterIcon');
    const fsExitIcon = document.getElementById('fsExitIcon');

    // 설정값 localStorage 복원 및 저장
    function loadSavedSettings() {
      try {
        const saved = localStorage.getItem('asterisk_rain_settings');
        if (saved) {
          const cfg = JSON.parse(saved);
          if (cfg.intensity != null) {
            baseIntensity = cfg.intensity;
            rainIntensitySlider.value = baseIntensity;
            rainIntensityVal.textContent = Math.round(baseIntensity * 100) + '%';
          }
          if (cfg.rainVol != null) {
            rainVolSlider.value = cfg.rainVol;
            rainVolVal.textContent = Math.round(cfg.rainVol * 100) + '%';
          }
          if (cfg.thunderVol != null) {
            thunderVolSlider.value = cfg.thunderVol;
            thunderVolVal.textContent = Math.round(cfg.thunderVol * 100) + '%';
          }
        }
      } catch (e) {}
    }

    function saveSettings() {
      try {
        localStorage.setItem('asterisk_rain_settings', JSON.stringify({
          intensity: baseIntensity,
          rainVol: parseFloat(rainVolSlider.value),
          thunderVol: parseFloat(thunderVolSlider.value)
        }));
      } catch (e) {}
    }
    loadSavedSettings();

    function openDrawer() {
      settingsDrawer.classList.remove('drawer-closed');
      settingsDrawer.classList.add('drawer-open');
      drawerBackdrop.classList.remove('opacity-0', 'pointer-events-none');
      drawerBackdrop.classList.add('opacity-100', 'pointer-events-auto');
    }

    function closeDrawer() {
      settingsDrawer.classList.add('drawer-closed');
      settingsDrawer.classList.remove('drawer-open');
      drawerBackdrop.classList.add('opacity-0', 'pointer-events-none');
      drawerBackdrop.classList.remove('opacity-100', 'pointer-events-auto');
    }

    toggleDrawerBtn.addEventListener('click', openDrawer);
    closeDrawerBtn.addEventListener('click', closeDrawer);
    drawerBackdrop.addEventListener('click', closeDrawer);

    async function togglePower() {
      if (!audioCtx) initAudio();

      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      if (!isRunning) {
        isRunning = true;

        powerText.textContent = "일시 정지";
        iconPlay.classList.add('hidden');
        iconPause.classList.remove('hidden');
        powerBtn.className = "w-full py-3 px-4 my-5 border border-[#F7F6F2] bg-[#F7F6F2] text-[#000000] font-mono-custom text-xs font-bold tracking-wider uppercase transition-all duration-150 flex items-center justify-center gap-2.5 shadow-md";

        quickPlayIcon.classList.add('hidden');
        quickPauseIcon.classList.remove('hidden');
        quickPlayBtn.classList.add('border-[#F7F6F2]', 'bg-[#F7F6F2]', 'text-black');
        quickPlayBtn.classList.remove('text-[#F7F6F2]', 'bg-[#14161B]/85');

        startRainSound();
        scheduleAutoThunder();
      } else {
        isRunning = false;

        powerText.textContent = "재생 시작";
        iconPlay.classList.remove('hidden');
        iconPause.classList.add('hidden');
        powerBtn.className = "w-full py-3 px-4 my-5 border border-[#383C46] bg-[#1C1E24] hover:bg-[#242730] text-[#F7F6F2] font-mono-custom text-xs font-semibold tracking-wider uppercase transition-all duration-150 flex items-center justify-center gap-2.5";

        quickPlayIcon.classList.remove('hidden');
        quickPauseIcon.classList.add('hidden');
        quickPlayBtn.classList.remove('border-[#F7F6F2]', 'bg-[#F7F6F2]', 'text-black');
        quickPlayBtn.classList.add('text-[#F7F6F2]', 'bg-[#14161B]/85');

        stopRainSound();
        if (thunderScheduler) clearTimeout(thunderScheduler);
      }
    }

    powerBtn.addEventListener('click', togglePower);
    quickPlayBtn.addEventListener('click', togglePower);

    triggerBtn.addEventListener('click', () => {
      if (!isRunning) {
        alert("먼저 소리 재생을 시작해주세요.");
        return;
      }
      triggerThunderDischarge(true);
    });

    function toggleFullscreen() {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (!isFs) {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(err => console.log(err));
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(err => console.log(err));
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function updateFullscreenUI() {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (isFs) {
        fullscreenText.textContent = "전체화면 종료";
        fsEnterIcon.classList.add('hidden');
        fsExitIcon.classList.remove('hidden');
      } else {
        fullscreenText.textContent = "전체화면 모드";
        fsEnterIcon.classList.remove('hidden');
        fsExitIcon.classList.add('hidden');
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFullscreenUI);
    document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

    rainIntensitySlider.addEventListener('input', (e) => {
      baseIntensity = parseFloat(e.target.value);
      rainIntensityVal.textContent = Math.round(baseIntensity * 100) + '%';
      saveSettings();
    });

    rainVolSlider.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      rainVolVal.textContent = Math.round(v * 100) + '%';
      if (rainBusGain && audioCtx) {
        rainBusGain.gain.setTargetAtTime(v, audioCtx.currentTime, 0.05);
      }
      saveSettings();
    });

    thunderVolSlider.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      thunderVolVal.textContent = Math.round(v * 100) + '%';
      if (thunderBusGain && audioCtx) {
        thunderBusGain.gain.setTargetAtTime(v, audioCtx.currentTime, 0.05);
      }
      saveSettings();
    });
  </script>
</body>
</html>
